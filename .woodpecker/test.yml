# Runs on pull_request AND on push to main.
#
# 🔴 `when: event: pull_request` alone is NOT a gate on main. We once shipped a
# repo whose checks only ever ran against proposals, never against the article
# that actually deployed — green all the way, guarding nothing. Both events,
# every time.
when:
  - event: pull_request
  - event: push
    branch: main

labels:
  runner: k8s

steps:
  - name: test
    image: registry.ops.ciphera.net/mirror/docker.io/library/node:22-94c973596a85@sha256:94c973596a8581a87ba42746ceb0b0e0b5246d098de45b1ce04dcc967cfc5dfb
    commands:
      # `npm ci` and not `npm install`: a stale node_modules invents a baseline
      # that neither CI nor another machine shares.
      - npm ci
      - npm run typecheck
      # One run writes the log and a JSON report (until 08-11-2026 the suite ran a second
      # time only to be counted). A zero-test run exits 0 on some vitest versions, so the count is
      # asserted rather than trusted. A FLOOR, not an equality — adding tests
      # must never redden the build.
      - npm test -- --reporter=default --reporter=json --outputFile.json=/tmp/vitest.json
      - |
        COUNT=$(node -e "try{const r=require('/tmp/vitest.json');console.log(r.numTotalTests||0)}catch(e){console.log(0)}")
        echo "vitest collected $COUNT test(s)"
        [ "$COUNT" -ge 31 ] || { echo "REFUSING: expected at least 31 tests, collected $COUNT — the suite shrank or stopped being collected"; exit 1; }
      - npm run build
      # Packaging guards live in a committed script, not inline here.
      #
      # 🔴 They used to be inline `node -e "…"` blocks, and one of them died on
      # the way through three layers of quoting — YAML block scalar → `sh`
      # double quotes → `node -e` — which ate a backslash and left node an
      # unterminated regex. It had passed locally, because a heredoc quotes
      # differently from this file. A guard whose local run and CI run are not
      # the same bytes is not a guard.
      #
      # `npm run check:package` is the same command in both places: zero runtime
      # dependencies, a CommonJS entrypoint with a callable default export, and
      # the exact tarball contents.
      - npm run check:package
