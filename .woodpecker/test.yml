# Runs on pull_request AND on push to main.
#
# 🔴 `when: event: pull_request` alone is NOT a gate on main. We once shipped a
# repo whose checks only ever ran against proposals, never against the article
# that actually deployed — green all the way, guarding nothing. Both events,
# every time.
when:
  - event: pull_request
  - event: push
    branch: main

labels:
  runner: k8s

steps:
  - name: test
    image: node:22
    commands:
      # `npm ci` and not `npm install`: a stale node_modules invents a baseline
      # that neither CI nor another machine shares.
      - npm ci
      - npm run typecheck
      # A zero-test run exits 0 on some vitest versions, so the count is
      # asserted rather than trusted. A FLOOR, not an equality — adding tests
      # must never redden the build.
      - npm test
      - |
        COUNT=$(npx vitest run --reporter=json --outputFile=/tmp/vitest.json >/dev/null 2>&1; \
                node -e "try{const r=require('/tmp/vitest.json');console.log(r.numTotalTests||0)}catch(e){console.log(0)}")
        echo "vitest collected $COUNT test(s)"
        [ "$COUNT" -ge 31 ] || { echo "REFUSING: expected at least 31 tests, collected $COUNT — the suite shrank or stopped being collected"; exit 1; }
      - npm run build
      # The published package must stay dependency-free. A runtime dependency
      # here lands in every consumer's site, and this package exists to add
      # under 3 KB to a page.
      - |
        DEPS=$(node -e "const p=require('./package.json');console.log(Object.keys(p.dependencies||{}).length)")
        echo "runtime dependencies: $DEPS"
        [ "$DEPS" -eq 0 ] || { echo "REFUSING: @ciphera-net/pulse-docusaurus must have zero runtime dependencies, found $DEPS"; exit 1; }
      # 🔴 The build output must stay CommonJS with a `default` export.
      #
      # Every official Docusaurus plugin ships that shape, and it is the shape
      # Docusaurus's loader has been proven to accept from both an ESM and a CJS
      # `docusaurus.config.js`. Flipping tsconfig's `module` to ESNext, or adding
      # `"type": "module"` to package.json, would still typecheck, still test
      # green, still build — and break every consumer's site build. Nothing else
      # in this pipeline can see that, so it is checked here directly.
      - |
        node -e "
          const p = require('./package.json');
          if (p.type === 'module') { console.error('REFUSING: package.json declares type: module — Docusaurus plugins ship CommonJS'); process.exit(1); }
          const m = require('./lib/index.js');
          if (typeof m.default !== 'function') { console.error('REFUSING: lib/index.js has no callable default export'); process.exit(1); }
          if (m.__esModule !== true) { console.error('REFUSING: lib/index.js is missing the __esModule interop marker'); process.exit(1); }
          console.log('plugin entrypoint: CommonJS, default export is a function');
        "
      # The tarball must be exactly LICENSE, README, lib/ and package.json.
      # `lib/` is gitignored, so only `prepack` puts it there — a packaging
      # regression ships an empty package that installs and silently does
      # nothing, which no test in this file would otherwise notice.
      - |
        npm pack --dry-run --json > /tmp/pack.json
        node -e "
          const files = require('/tmp/pack.json')[0].files.map(f => f.path).sort();
          const unexpected = files.filter(f => !/^(lib\/|README\.md$|LICENSE$|package\.json$)/.test(f));
          console.log('tarball contents:', files.join(' '));
          if (unexpected.length) { console.error('REFUSING: unexpected files in the tarball:', unexpected.join(' ')); process.exit(1); }
          if (!files.includes('lib/index.js')) { console.error('REFUSING: tarball has no lib/index.js — prepack did not run'); process.exit(1); }
        "
